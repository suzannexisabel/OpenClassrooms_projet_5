name: CI-CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  tests-no-db:
    name: Tests (unit + functional DB OFF)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (imports only)
        run: |
          python - <<'PY'
          import pandas
          import numpy
          import sklearn
          print("Dependencies imported successfully")
          PY

      - name: Run unit + functional tests with coverage (DB OFF)
        run: |
          pytest -m "unit or functional" -vv \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-no-db.xml

      - name: Upload coverage report (DB OFF)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-no-db
          path: coverage-no-db.xml

  tests-with-db:
    name: Tests (DB ON)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mluser
          POSTGRES_PASSWORD: mlpass
          POSTGRES_DB: mldb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mluser -d mldb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # IMPORTANT: les tests DB utilisent DATABASE_URL_TEST
      DATABASE_URL_TEST: postgresql+psycopg://mluser:mlpass@localhost:5432/mldb_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB tests with coverage
        run: |
          pytest -m db -vv \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage-with-db.xml

      - name: Upload coverage report (DB ON)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-with-db
          path: coverage-with-db.xml

  deploy-hf:
    name: Deploy to Hugging Face Spaces 
    runs-on: ubuntu-latest
    needs: [tests-no-db, tests-with-db]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git"
          git push hf main:main --force
